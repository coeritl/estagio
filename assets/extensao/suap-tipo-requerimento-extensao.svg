<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Seleção do Requerimento Único para Atividades de Extensão</title>
  <desc id="desc">Representação vetorial da tela do SUAP com o tipo de documento Requerimento Único para Atividades de Extensão selecionado.</desc>
  <rect width="1200" height="700" rx="22" fill="#fff"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="42" y="60" font-size="24" fill="#0a7767">Início</text><text x="118" y="60" font-size="24" fill="#747474">›</text>
    <text x="145" y="60" font-size="24" fill="#0a7767">Documentos de Texto</text><text x="372" y="60" font-size="24" fill="#747474">›</text>
    <text x="400" y="60" font-size="24" fill="#0a7767">Adicionar Documento de Texto</text>
    <text x="42" y="132" font-size="46" font-weight="700" fill="#171717">Adicionar Documento de Texto</text>
    <rect x="42" y="184" width="1116" height="458" rx="12" fill="#f5f5f5" stroke="#cfcfcf" stroke-width="2"/>
    <rect x="42" y="184" width="1116" height="82" rx="12" fill="#e5e5e5"/><rect x="42" y="250" width="1116" height="16" fill="#e5e5e5"/>
    <text x="86" y="236" font-size="31" fill="#333">Dados do Documento</text>
    <text x="82" y="330" font-size="29" font-weight="700" fill="#333"><tspan fill="#c22">*</tspan> Tipo do Documento:</text>
    <rect x="382" y="285" width="710" height="70" rx="10" fill="#fff" stroke="#159987" stroke-width="4"/>
    <text x="403" y="330" font-size="25" fill="#777">Selecione</text>
    <text x="82" y="422" font-size="29" font-weight="700" fill="#333"><tspan fill="#c22">*</tspan> Modelo:</text>
    <rect x="382" y="355" width="710" height="230" fill="#fff" stroke="#b8b8b8" stroke-width="2"/>
    <text x="407" y="402" font-size="25" fill="#333">Requerimento de Convalidação de Estágio</text>
    <text x="407" y="454" font-size="25" fill="#333">Requerimento de Equiparação ao Estágio Obrigatório</text>
    <rect x="382" y="470" width="710" height="58" fill="#666"/>
    <text x="407" y="508" font-size="25" font-weight="700" fill="#fff">Requerimento Único para Atividades de Extensão</text>
    <text x="407" y="565" font-size="25" fill="#333">Resolução</text>
    <text x="82" y="620" font-size="29" font-weight="700" fill="#333"><tspan fill="#c22">*</tspan> Assunto:</text>
  </g>
</svg>
